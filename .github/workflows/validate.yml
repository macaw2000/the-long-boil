name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same single command agents run locally. Standard library only;
      # the code stays Python 3.9 compatible and is run on 3.9 locally.
      - run: python3 scripts/validate/run.py
